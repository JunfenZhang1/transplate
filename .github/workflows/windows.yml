name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.8"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package Windows application with OCR models
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Transplate
          --collect-all rapidocr
          --collect-all onnxruntime
          --collect-all cv2
          --collect-all opencc
          --hidden-import=onnxruntime.capi.onnxruntime_pybind11_state
          launcher.py
      - name: Smoke test bundled OCR
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\Transplate\Transplate.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorFile = Join-Path $env:RUNNER_TEMP 'transplate-selftest-error.txt'
            if (Test-Path $errorFile) { Get-Content $errorFile }
            throw "Bundled OCR smoke test failed: $($process.ExitCode)"
          }
      - name: Archive portable Windows build
        shell: pwsh
        run: Compress-Archive -Path dist/Transplate -DestinationPath Transplate-Windows-x64.zip
      - name: Upload Windows artifact (CI backup)
        uses: actions/upload-artifact@v4
        with:
          name: Transplate-Windows-x64
          path: Transplate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish development Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Transplate Windows preview #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            自动发布的 Windows x64 预览版。仅在单元测试、打包及 OCR 冒烟测试成功后发布。
            下载 ZIP 并解压，运行 Transplate/Transplate.exe。请保留 _internal 文件夹。
            Commit: ${{ github.sha }}
          files: Transplate-Windows-x64.zip
          fail_on_unmatched_files: true
      - name: Publish versioned Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Transplate ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: Transplate-Windows-x64.zip
          fail_on_unmatched_files: true
