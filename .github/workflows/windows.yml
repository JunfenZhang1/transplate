name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install app and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pyinstaller>=6.8"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package Windows application with OCR models
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name Transplate
          --collect-all rapidocr
          --collect-all onnxruntime
          --collect-all cv2
          --collect-all opencc
          --hidden-import=onnxruntime.capi.onnxruntime_pybind11_state
          launcher.py
      - name: Smoke test bundled OCR
        shell: pwsh
        run: |
          & .\dist\Transplate\Transplate.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Bundled OCR smoke test failed: $LASTEXITCODE" }
      - name: Archive portable Windows build
        shell: pwsh
        run: Compress-Archive -Path dist/Transplate -DestinationPath Transplate-Windows-x64.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transplate-Windows-x64
          path: Transplate-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
