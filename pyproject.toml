[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transplate"
version = "0.2.0"
description = "Windows live subtitle OCR, Traditional Chinese conversion, and translated overlay"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.7,<7",
  "mss>=9,<11",
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
  "rapidocr>=3.10,<4",
  "onnxruntime>=1.20,<2",
  "opencc-python-reimplemented>=0.1.7,<1",
  "deep-translator>=1.11.4,<2",
]

[project.scripts]
transplate = "transplate.app:main"

[tool.setuptools.packages.find]
include = ["transplate*"]
